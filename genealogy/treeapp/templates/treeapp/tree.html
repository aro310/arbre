{% extends 'treeapp/base.html' %}

{% block content %}
<h1>Arbre visuel interactif</h1>
<p>Zoom : molette | Déplacement : glisser-déposer.</p>
<div class="tree-actions">
  <button type="button" id="export-image">Exporter en image</button>
  <button type="button" id="export-pdf">Exporter en PDF</button>
</div>
<div id="tree-container">
  <svg id="tree-svg" width="100%" height="900"></svg>
</div>
<div id="person-hover-card" class="person-hover-card" aria-hidden="true">
  <img id="hover-image" src="" alt="Aperçu personne">
  <div id="hover-name"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="/static/treeapp/js/tree.js"></script>
{% endblock %}
